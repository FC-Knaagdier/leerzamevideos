<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Leerzame videos</title>

<style>

/* Zwevende knop rechts voor cookie-instellingen */
.float-cookie-button {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: #333;
    color: white;
    border: 4px solid transparent;
    border-radius: 10px;
    padding: 15px 25px;
    font-size: 18px;
    cursor: pointer;
    z-index: 1000;
    display: none;
}

.float-cookie-button:hover,
.float-cookie-button:focus {
    border-color: white;
    background: #555;
}

.float-cookie-button.visible {
    display: block;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   TITEL
========================= */

h1 {
    text-align: center;
    padding: 20px;
}

/* =========================
   VIDEO'S
========================= */

.video-container {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 15px;

    padding: 20px;

    max-width: 1400px;

    margin: auto;

}

.video {

    background: #222;

    border: 5px solid transparent;

    border-radius: 12px;

    overflow: hidden;

}

.video.selected {

    border-color: white;

}

/*
 * Dit element bevat thumbnail
 * of YouTube-video.
 */

.video-player {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: black;

    position: relative;

}

.video-player img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;

}

/*
 * YouTube iframe.
 *
 * pointer-events:none zorgt ervoor
 * dat de TV-navigatie bij de pagina
 * blijft en niet door de iframe
 * wordt overgenomen.
 */

.video-player iframe {

    display: block;

    width: 100%;

    height: 100%;

    border: 0;

    pointer-events: none;

}

.video-title {

    padding: 15px;

    text-align: center;

    font-size: 20px;

}

/* =========================
   BEDIENING
========================= */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 15px;

    margin: 10px auto 30px;

    padding: 0 20px;

}

.control-button {

    background: #333;

    color: white;

    border: 4px solid transparent;

    border-radius: 10px;

    padding: 12px 25px;

    font-size: 20px;

    outline: none;

}

.control-button.selected {

    border-color: white;

    background: #555;

}

/* =========================
   COOKIEBANNER
========================= */

.cookie-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.90);

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 99999;

}

.cookie-box {

    width: min(750px, 90%);

    background: #222;

    padding: 30px;

    border-radius: 15px;

    text-align: center;

}

.cookie-box h2 {

    margin-top: 0;

}

.cookie-box p {

    line-height: 1.6;

}

.cookie-buttons {

    display: flex;

    justify-content: center;

    gap: 15px;

    margin-top: 25px;

    flex-wrap: wrap;

}

.cookie-button {

    background: #333;

    color: white;

    border: 5px solid transparent;

    border-radius: 10px;

    padding: 15px 25px;

    font-size: 18px;

    outline: none;

}

.cookie-button.selected {

    border-color: white;

    background: #555;

    transform: scale(1.05);

}

/* =========================
   WIJZIG COOKIES KNOP
========================= */

.cookie-change {
    background: #333;
    color: white;
    border: 5px solid transparent;
    border-radius: 10px;
    padding: 15px 25px;
    font-size: 18px;
    margin-top: 20px;
    outline: none;
}

.cookie-change.selected {
    border-color: white;
    background: #555;
    transform: scale(1.05);
}

/* =========================
   MOBIEL
========================= */

@media (max-width: 700px) {

    .video-container {

        grid-template-columns: 1fr;

    }

    .controls {

        flex-wrap: wrap;

    }

    .cookie-buttons {

        flex-direction: column;

    }

    .cookie-button {

        width: 100%;

    }

    .cookie-change {
        width: 100%;
    }

}

#tvFocus {
    position: fixed;
    left: -10000px;
    top: -10000px;
    width: 1px;
    height: 1px;
    opacity: 0;
}
</style>

</head>

<body>

<div
    id="tvFocus"
    tabindex="0"
    aria-hidden="true">
</div>
    <h1>🦫 RodentTube</h1>
<button
    id="floatCookieButton"
    class="float-cookie-button">
    🍪 Cookies wijzigen
</button>

<div
    id="videos"
    class="video-container">
</div>

<div
    id="controls"
    class="controls"
    style="display:none;">

    <button
        id="playPauseButton"
        class="control-button selected">

        ▶ Afspelen

    </button>

</div>

<!-- =========================
     COOKIEBANNER
========================= -->

<div
    id="cookieOverlay"
    class="cookie-overlay">

    <div class="cookie-box">

        <h2>YouTube video's</h2>

        <p>
            Om video's af te spelen gebruiken wij
            YouTube.

            Als je accepteert, wordt de
            YouTube-speler geladen.

            YouTube kan daarbij cookies of
            vergelijkbare technieken gebruiken.
        </p>

        <div class="cookie-buttons">

            <button
                id="acceptButton"
                class="cookie-button selected"
                type="button">

                Accepteren

            </button>

            <button
                id="rejectButton"
                class="cookie-button"
                type="button">

                Weigeren

            </button>

            <button
                id="termsButton"
                class="cookie-button"
                type="button">

                YouTube voorwaarden

            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   VIDEO'S
========================= */

const videos = [
    {
        titel: "Sesamstraat 1 uur",
        id: "xPfU-GJBC1M"
    },
    {
        titel: "Elmo en Bobbie 1 uur",
        id: "xQuDsj5x764"
    },
    {
        titel: "Sesamstraat Klokkijken",
        id: "PAPAGJCiH3o"
    },
    {
        titel: "Rekenen met koekjes",
        id: "ah58Qu8Yd7o"
    },
    {
        titel: "Waar komt melk vandaan?",
        id: "NLaAsQqL7ek"
    },
    {
        titel: "Elmo doet dieren na",
        id: "JTQYn7X8EUA"
    },
    {
        titel: "Les zwaar en licht",
        id: "cNZlh3LIlWo"
    },
    {
        titel: "Les over lichaamsdelen",
        id: "5cyEsTbAtYM"
    },
    {
        titel: "Leren tellen tot 10",
        id: "nvBzYcAmYWs"
    }
];

/* =========================
   ELEMENTEN
========================= */

const videoContainer =
    document.getElementById("videos");

const controls = document.getElementById("controls");

const playPauseButton = document.getElementById("playPauseButton");

const cookieOverlay =
    document.getElementById("cookieOverlay");

const acceptButton =
    document.getElementById("acceptButton");

const rejectButton =
    document.getElementById("rejectButton");

const termsButton =
    document.getElementById("termsButton");

let changeCookiesButton = null;

const floatCookieButton =
    document.getElementById("floatCookieButton");

/* =========================
   STATUS
========================= */

let videoFocus = 0;

let cookieFocus = 0;

let youtubeReady = false;

let showingRejectedScreen = false;

let videosLoaded = false;

let needToLoadVideos = false;

/*
 * Alle YouTube-spelers.
 */

const players = {};

/*
 * Video die momenteel speelt.
 *
 * -1 = niets
 */

let playingVideo = -1;

/* =========================
   YOUTUBE API
========================= */

function laadYouTubeAPI() {

    if (
        document.getElementById("youtube-api")
    ) {

        if (needToLoadVideos && !videosLoaded) {
            laadVideos();
        }
        return;

    }

    const script =
        document.createElement("script");

    script.id =
        "youtube-api";

    script.src =
        "https://www.youtube.com/iframe_api";

    document.body.appendChild(
        script
    );

}

/*
 * Deze functie wordt automatisch
 * door YouTube aangeroepen.
 */

window.onYouTubeIframeAPIReady =
function() {

    youtubeReady = true;

    if (!videosLoaded) {
        laadVideos();
    }

};

/* =========================
   VIDEO'S TONEN
========================= */

function laadVideos() {

    if (videosLoaded) {
        return;
    }

    videosLoaded = true;

    videoContainer.innerHTML = "";

    videos.forEach(
        function(video, index) {

            const element =
                document.createElement("div");

            element.className =
                "video";

            element.dataset.index =
                index;

            element.innerHTML = `

                <div
                    class="video-player"
                    id="video-player-${index}">

                    <img
                        src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg"
                        alt="${video.titel}">

                </div>

                <div class="video-title">
                    ${video.titel}
                </div>

            `;

            element.addEventListener(
                "click",
                function() {

                    videoFocus = index;

                    updateVideoFocus();

                    toggleVideo();

                }
            );

            videoContainer.appendChild(
                element
            );

        }
    );

    updateVideoFocus();

}

/* =========================
   SELECTIE
========================= */

function updateVideoFocus() {

    const elements =
        document.querySelectorAll(
            ".video"
        );

    elements.forEach(
        function(element) {

            element.classList.remove(
                "selected"
            );

        }
    );

    const selected =
        elements[videoFocus];

    if (!selected) {

        return;

    }

    selected.classList.add(
        "selected"
    );

    selected.scrollIntoView({

        behavior: "smooth",

        block: "nearest",

        inline: "nearest"

    });

    updatePlayPauseButton();

}

/* =========================
   VIDEO STARTEN
========================= */

function startVideo(index) {

    if (!youtubeReady) {

        return;

    }

    if (
        playingVideo !== -1 &&
        playingVideo !== index
    ) {

        stopVideo(playingVideo);

    }

    if (players[index]) {

        players[index].playVideo();

        playingVideo = index;

        updatePlayPauseButton();

        return;

    }

    const container =
        document.getElementById(
            `video-player-${index}`
        );

    if (!container) {

        return;

    }

    container.innerHTML = "";

    const playerElement =
        document.createElement("div");

    playerElement.id =
        `youtube-player-${index}`;

    container.appendChild(
        playerElement
    );

    players[index] =
        new YT.Player(
            `youtube-player-${index}`,
            {

                videoId:
                    videos[index].id,

                playerVars: {

                    autoplay: 1,

                    controls: 1,

                    rel: 0,

                    playsinline: 1

                },

                events: {

                    onReady:
                        function(event) {

                            event.target.playVideo();

                            playingVideo =
                                index;

                            updatePlayPauseButton();

                        },

                    onStateChange:
                        function(event) {

                            if (
                                event.data ===
                                YT.PlayerState.PLAYING
                            ) {

                                playingVideo =
                                    index;

                            }

                            else if (
                                event.data ===
                                YT.PlayerState.ENDED
                            ) {

                                if (
                                    playingVideo ===
                                    index
                                ) {

                                    playingVideo =
                                        -1;

                                }

                            }

                            updatePlayPauseButton();

                        }

                }

            }
        );

}

/* =========================
   VIDEO STOPPEN
========================= */

function stopVideo(index) {

    const player =
        players[index];

    if (!player) {

        return;

    }

    try {

        player.stopVideo();

    }

    catch (error) {

        console.log(error);

    }

}

/* =========================
   START / PAUZE
========================= */

function toggleVideo() {

    if (!youtubeReady) {

        return;

    }

    if (!players[videoFocus]) {

        startVideo(videoFocus);

        return;

    }

    const player =
        players[videoFocus];

    const state =
        player.getPlayerState();

    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        player.pauseVideo();

        return;

    }

    if (
        playingVideo !== -1 &&
        playingVideo !== videoFocus
    ) {

        stopVideo(playingVideo);

    }

    player.playVideo();

    playingVideo =
        videoFocus;

    updatePlayPauseButton();

}

/* =========================
   KNOPTEKST
========================= */

function updatePlayPauseButton() {

    if (
        playingVideo ===
        videoFocus
    ) {

        const player =
            players[videoFocus];

        if (
            player &&
            player.getPlayerState() ===
            YT.PlayerState.PLAYING
        ) {

            playPauseButton.textContent =
                "⏸ Pauze";

            return;

        }

    }

    playPauseButton.textContent =
        "▶ Afspelen";

}

/* =========================
   VOLGENDE
========================= */

function volgendeVideo() {

    videoFocus++;

    if (
        videoFocus >=
        videos.length
    ) {

        videoFocus = 0;

    }

    updateVideoFocus();

}

/* =========================
   VORIGE
========================= */

function vorigeVideo() {

    videoFocus--;

    if (
        videoFocus < 0
    ) {

        videoFocus =
            videos.length - 1;

    }

    updateVideoFocus();

}

/* =========================
   COOKIE ACCEPTEREN
========================= */

function accepteerCookies() {

    console.log("ACCEPTEREN GEDRUKT!");

    localStorage.setItem(
        "youtubeToestemming",
        "ja"
    );

    cookieOverlay.style.display =
        "none";

    controls.style.display =
        "flex";

    floatCookieButton.classList.add("visible");

    needToLoadVideos = true;
    laadYouTubeAPI();

}

/* =========================
   COOKIE WEIGEREN
========================= */
function weigerCookies() {

    console.log("WEIGEREN GEDRUKT!");

    localStorage.setItem(
        "youtubeToestemming",
        "nee"
    );

    cookieOverlay.style.display =
        "none";

    controls.style.display =
        "none";

    toonCookieWeigering();

}

function toonCookieWeigering() {

    showingRejectedScreen = true;

    videoContainer.innerHTML = `

        <div class="cookie-rejected">

            <p>
                Je hebt het gebruik van YouTube-cookies geweigerd.
            </p>

            <p>
                Om YouTube-video's te kunnen bekijken,
                moet je cookies accepteren.
            </p>

            <p>
                Dat doe je door:
            </p>

            <ul>
                <li>De cookies/sitegegevens van deze site te wissen in je browser, OF</li>
                <li>Op de <strong>Wijzig cookies</strong>-knop hieronder te klikken.</li>
                <li>Je kan ook de cookies wijzigen door op enter te drukken of op de grote Ronde play-knop</li>
            </ul>

            <br>

            <button
                id="changeCookiesButton"
                class="cookie-change"
                type="button">

                Wijzig cookies

            </button>

        </div>

    `;

    changeCookiesButton =
        document.getElementById(
            "changeCookiesButton"
        );

    changeCookiesButton.onclick =
        wijzigCookies;

    geefTVFocus();

}

/* =========================
   VOORWAARDEN
========================= */

function wijzigCookies() {

    console.log("WIJZIG COOKIES GEDRUKT!");

    cookieOverlay.style.display =
        "flex";

    controls.style.display =
        "none";

    floatCookieButton.classList.remove("visible");

    showingRejectedScreen = false;

    videosLoaded = false;
    needToLoadVideos = true;

    cookieFocus = 0;

    updateCookieFocus();

    geefTVFocus();

}

function openVoorwaarden() {

    console.log("VOORWAARDEN GEDRUKT!");

    window.open(
        "https://support.google.com/youtube/answer/10364219?hl=nl-US#zippy=%2Choe-kan-youtube-verzamelde-gegevens-gebruiken%2Cbepalen-welke-gegevens-en-activiteit-worden-gebruikt-om-advertenties-te-personaliseren",
        "_blank"
    );

}

/* =========================
   COOKIE SELECTIE
========================= */

function updateCookieFocus() {

    acceptButton.classList.remove(
        "selected"
    );

    rejectButton.classList.remove(
        "selected"
    );

    termsButton.classList.remove(
        "selected"
    );

    if (changeCookiesButton) {

        changeCookiesButton.classList.remove(
            "selected"
        );

    }

    if (cookieFocus === 0) {

        acceptButton.classList.add(
            "selected"
        );

    }

    else if (cookieFocus === 1) {

        rejectButton.classList.add(
            "selected"
        );

    }

    else if (cookieFocus === 2) {

        termsButton.classList.add(
            "selected"
        );

    }

}

/* =========================
   MUIS
========================= */

acceptButton.onclick =
    accepteerCookies;

rejectButton.onclick =
    weigerCookies;

termsButton.onclick =
    openVoorwaarden;

floatCookieButton.onclick =
    wijzigCookies;

playPauseButton.onclick =
    toggleVideo;

/* =========================
   AFSTANDSBEDIENING (FIRE TV COMPATIBLE)
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        /* Get key code for Fire TV compatibility */
        const keyCode = event.keyCode || event.which || event.keyCode;

        if (
            showingRejectedScreen &&
            changeCookiesButton
        ) {

            if (event.key === "Enter" || keyCode === 13 || keyCode === 2218) {
                event.preventDefault();
                event.stopImmediatePropagation();
                wijzigCookies();
                return;
            }

        }

        if (
            cookieOverlay.style.display
            !== "none"
        ) {

            if (event.key === "Enter" || keyCode === 13 || keyCode === 2218) {
                event.preventDefault();
                event.stopImmediatePropagation();
            }

            /* Navigate right */
            if (
                event.key === "ArrowRight" ||
                keyCode === 39 ||
                keyCode === 2217
            ) {

                event.preventDefault();
                event.stopImmediatePropagation();

                cookieFocus++;

                if (cookieFocus > 2) {
                    cookieFocus = 0;
                }

                updateCookieFocus();
                return;

            }

            /* Navigate left */
            if (
                event.key === "ArrowLeft" ||
                keyCode === 37 ||
                keyCode === 2216
            ) {

                event.preventDefault();
                event.stopImmediatePropagation();

                cookieFocus--;

                if (cookieFocus < 0) {
                    cookieFocus = 2;
                }

                updateCookieFocus();
                return;

            }

            /* ENTER KEY - ACTIVEREN */
            if (
                event.key === "Enter" ||
                keyCode === 13 ||
                keyCode === 2218
            ) {

                console.log("COOKIE FOCUS:", cookieFocus);

                if (cookieFocus === 0) {

                    console.log("Accepteren geselecteerd!");
                    accepteerCookies();

                }

                else if (cookieFocus === 1) {

                    console.log("Weigeren geselecteerd!");
                    weigerCookies();

                }

                else if (cookieFocus === 2) {

                    console.log("Voorwaarden geselecteerd!");
                    openVoorwaarden();

                }

                return;

            }

        }

        /* Video navigation */
        if (
            event.key === "ArrowRight" ||
            keyCode === 39 ||
            keyCode === 2217
        ) {

            event.preventDefault();
            event.stopImmediatePropagation();

            volgendeVideo();
            return;

        }

        if (
            event.key === "ArrowLeft" ||
            keyCode === 37 ||
            keyCode === 2216
        ) {

            event.preventDefault();
            event.stopImmediatePropagation();

            vorigeVideo();
            return;

        }

        if (
            event.key === "Enter" ||
            keyCode === 13 ||
            keyCode === 2218
        ) {

            event.preventDefault();
            event.stopImmediatePropagation();

            toggleVideo();
            return;

        }

    },
    true
);

/* =========================
   START
========================= */

const toestemming =
    localStorage.getItem(
        "youtubeToestemming"
    );

if (
    toestemming === "ja"
) {

    cookieOverlay.style.display =
        "none";

    controls.style.display =
        "flex";

    floatCookieButton.classList.add("visible");

    needToLoadVideos = true;
    laadYouTubeAPI();

}

else if (
    toestemming === "nee"
) {

    cookieOverlay.style.display =
        "none";

    toonCookieWeigering();

}
else {

    cookieFocus = 0;

    updateCookieFocus();

}

/* =========================
   TV FOCUS
========================= */

const tvFocus =
    document.getElementById("tvFocus");

function geefTVFocus() {

    if (!tvFocus) {
        return;
    }

    tvFocus.focus({
        preventScroll: true
    });

}

/* =========================
   PAGINA START
========================= */

function startTV() {

    geefTVFocus();

    const toestemming =
        localStorage.getItem(
            "youtubeToestemming"
        );

    if (toestemming === "ja") {

        cookieOverlay.style.display =
            "none";

        controls.style.display =
        "flex";

        floatCookieButton.classList.add("visible");

        needToLoadVideos = true;
        laadYouTubeAPI();

    }

    else if (toestemming === "nee") {

        cookieOverlay.style.display =
            "none";

        controls.style.display =
        "none";

        toonCookieWeigering();

    }

    else {

        cookieOverlay.style.display =
            "flex";

        cookieFocus = 0;

        updateCookieFocus();

    }

    setTimeout(
        geefTVFocus,
        50
    );

}

/* =========================
   START BIJ LADEN
========================= */

if (
    document.readyState === "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        startTV
    );

}
else {

    startTV();

}

</script>

</body>
</html>
